# weeb-box · Carbon uosc theme
# Install:
#   mkdir -p ~/.config/mpv/script-opts
#   cp themes/mpv/uosc.conf ~/.config/mpv/script-opts/uosc.conf
# If you already have a uosc.conf, merge these keys instead of overwriting.

# --- title bar ---------------------------------------------------------------
# `always` keeps the title visible; use `no-border` for a floating look.
top_bar=always
top_bar_size=38
top_bar_controls=no
top_bar_title=yes
top_bar_alt_title=${filename}
top_bar_alt_title_place=toggle
top_bar_flash_on=video,audio
window_border_size=1

# --- timeline ----------------------------------------------------------------
timeline_style=line
timeline_size=38
timeline_line_width=2
timeline_persistency=paused
timeline_cache=yes
timeline_step=5
progress=windowed
progress_size=2
progress_line_width=24

# --- controls ----------------------------------------------------------------
# Keep it clean: menu, subtitle/audio pickers, transport, fullscreen.
controls=menu,gap,subtitles,toggle:closed_caption:sub-visibility?Toggle subtitles,gap,space,prev,play-pause,next,space,audio,gap,speed,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
volume=right
volume_size=40
volume_step=1
speed_step=0.1

# --- menus -------------------------------------------------------------------
menu_item_height=36
menu_min_width=260
menu_padding=4
menu_type_to_search=yes

# --- geometry / motion -------------------------------------------------------
scale=1
scale_fullscreen=1.2
font_scale=1
text_border=1.2
border_radius=6
animation_duration=140
proximity_in=40
proximity_out=120
pause_indicator=flash
destination_time=time-remaining
time_precision=0
buffered_time_threshold=30

# --- IBM Carbon dark palette -------------------------------------------------
color=foreground=f4f4f4,foreground_text=161616,background=161616,background_text=f4f4f4,window_border=393939,curtain=161616,success=42be65,error=fa4d56,match=78a9ff,heatmap=78a9ff
opacity=timeline=0.85,position=1,chapters=0.7,slider=0.85,slider_gauge=1,controls=0,speed=0.5,menu=0.98,submenu=0.35,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.75,idle_indicator=0.7,audio_indicator=0.4,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.35,pause_indicator=0.7

# --- anime-specific niceties -------------------------------------------------
chapter_ranges=openings:78a9ff,endings:be95ff,ads:fa4d5680
languages=slang,en
subtitles_directory=~~/subtitles
adjust_osd_margins=yes
